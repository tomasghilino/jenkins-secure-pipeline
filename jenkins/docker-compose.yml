name: jenkins

services:
  controller:
    build: ./controller
    image: jsp-jenkins-controller:local
    ports:
      - "127.0.0.1:8080:8080"
    secrets:
      - jenkins_admin_password
      - agent_ssh_key
      - github_deploy_key
      - sonarqube_token
      - sonarqube_webhook_secret
    volumes:
      - controller-home:/var/jenkins_home
    depends_on:
      - agent

  agent:
    build: ./agent
    image: jsp-jenkins-agent:local
    environment:
      JENKINS_AGENT_SSH_PUBKEY: ${JENKINS_AGENT_SSH_PUBKEY:?run scripts/jenkins-local-secrets.sh}
    volumes:
      - agent-workspace:/home/jenkins/agent
      - docker-certs-client:/certs/client:ro
    depends_on:
      - docker

  docker:
    image: docker:29.8.1-dind@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    # stale pid files from an unclean stop keep dockerd from starting again
    tmpfs:
      - /run
    volumes:
      - docker-certs-client:/certs/client
      - docker-data:/var/lib/docker
      - agent-workspace:/home/jenkins/agent

  sonarqube:
    image: sonarqube:26.9.0.129388-community@sha256:58b068af30bdfdccf91222de36e310529033e853dfae221b429cba80d10d5751
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_TELEMETRY_ENABLE: "false"
    secrets:
      - source: sonarqube_properties
        target: /opt/sonarqube/conf/sonar.properties
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - default
      - sonarqube-internal
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-temp:/opt/sonarqube/temp
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9000/api/system/status | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    stop_grace_period: 60s
    depends_on:
      sonarqube-db:
        condition: service_healthy

  sonarqube-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD_FILE: /run/secrets/sonarqube_db_password
    secrets:
      - sonarqube_db_password
    networks:
      - sonarqube-internal
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube -d sonarqube"]
      interval: 2s
      timeout: 3s
      retries: 15
    stop_grace_period: 30s

networks:
  sonarqube-internal:
    internal: true

secrets:
  jenkins_admin_password:
    file: ./secrets/jenkins_admin_password
  agent_ssh_key:
    file: ./secrets/agent_ssh_key
  github_deploy_key:
    file: ./secrets/github_deploy_key
  sonarqube_db_password:
    file: ./secrets/sonarqube_db_password
  sonarqube_properties:
    file: ./secrets/sonarqube.properties
  sonarqube_token:
    file: ./secrets/sonarqube_token
  sonarqube_webhook_secret:
    file: ./secrets/sonarqube_webhook_secret

volumes:
  controller-home:
  agent-workspace:
  docker-certs-client:
  docker-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  sonarqube-temp:
  sonarqube-db-data:
