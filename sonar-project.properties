sonar.projectKey=jenkins-secure-pipeline
sonar.sourceEncoding=UTF-8

sonar.sources=app/src
sonar.exclusions=**/*.spec.ts
sonar.tests=app/src,app/test
sonar.test.inclusions=app/src/**/*.spec.ts,app/test/**/*.ts

sonar.javascript.lcov.reportPaths=app/coverage/unit/lcov.info,app/coverage/e2e/lcov.info

# S2699 does not count supertest .expect() calls as assertions
sonar.issue.ignore.multicriteria=s2699
sonar.issue.ignore.multicriteria.s2699.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.s2699.resourceKey=app/test/**/*.e2e-spec.ts
